<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#1a365d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d4af37"/>
      <stop offset="100%" style="stop-color:#f4d03f"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Decorative glass pattern -->
  <rect x="50" y="50" width="1100" height="530" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.3"/>
  <rect x="70" y="70" width="1060" height="490" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.2"/>
  
  <!-- Logo area -->
  <circle cx="600" cy="200" r="80" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <text x="600" y="215" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#gold)" text-anchor="middle">SG</text>
  
  <!-- Company name Hebrew -->
  <text x="600" y="320" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="white" text-anchor="middle">אחים שוואקי זכוכית</text>
  
  <!-- English name -->
  <text x="600" y="380" font-family="Arial, sans-serif" font-size="32" fill="#d4af37" text-anchor="middle">Shwaki Brothers Glassworks</text>
  
  <!-- Tagline -->
  <text x="600" y="450" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.8)" text-anchor="middle">מקלחונים | מעקות זכוכית | מראות | חזיתות</text>
  
  <!-- Services in English -->
  <text x="600" y="490" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.6)" text-anchor="middle">Showers • Glass Railings • Mirrors • Storefronts</text>
  
  <!-- Contact info -->
  <text x="600" y="560" font-family="Arial, sans-serif" font-size="20" fill="url(#gold)" text-anchor="middle">📞 054-997-0809 | 🌐 shwakiglassworks.com</text>
</svg>
